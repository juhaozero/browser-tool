<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="g-accent-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 品牌 Logo -->
  <symbol id="app-logo" viewBox="0 0 32 32">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1.25"/>
    <rect x="5.5" y="6" width="21" height="4" rx="1.25" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <circle cx="7.5" cy="8" r="0.75" fill="#22d3ee" filter="url(#glow)"/>
    <rect x="5.5" y="12.5" width="9" height="8.5" rx="1.75" fill="url(#g-accent)"/>
    <rect x="5.5" y="12.5" width="9" height="2.5" rx="1.75" fill="url(#g-shine)"/>
    <rect x="17.5" y="12.5" width="9" height="8.5" rx="1.75" fill="url(#g-accent-v)"/>
    <rect x="17.5" y="12.5" width="9" height="2.5" rx="1.75" fill="url(#g-shine)"/>
    <path d="M8.2 16.2 7 17.5l1.2 1.2M11.3 16.2l1.2 1.3-1.2 1.2" stroke="#ecfeff" stroke-width="0.85" stroke-linecap="round"/>
    <circle cx="22" cy="16.8" r="1.6" stroke="#cffafe" stroke-width="0.75" fill="none"/>
  </symbol>

  <!-- JSON 大括号 -->
  <symbol id="icon-braces" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9" stroke-opacity="0.5"/>
    <path d="M9.5 7.5C8 7.5 7 8.8 7 10.5v1c0 1 .-.5 1.5-1.5 1.5S4 12.5 4 11.5v-1C4 7.8 6 5.5 9.5 5.5M14.5 7.5C16 7.5 17 8.8 17 10.5v1c0 1 .5 1.5 1.5 1.5S20 12.5 20 11.5v-1C20 7.8 18 5.5 14.5 5.5" stroke="url(#g-accent)" stroke-width="1.6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M9.5 16.5C8 16.5 7 15.2 7 13.5v-1M14.5 16.5C16 16.5 17 15.2 17 13.5v-1" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </symbol>

  <!-- Base64 01 -->
  <symbol id="icon-binary" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <rect x="3" y="4" width="18" height="4.5" rx="3" fill="url(#g-shine)"/>
    <text x="6" y="15" font-family="monospace" font-size="6" font-weight="700" fill="#22d3ee">01</text>
    <text x="14" y="15" font-family="monospace" font-size="6" font-weight="700" fill="#0891b2">64</text>
    <path d="M6 8h12" stroke="#334155" stroke-width="0.75"/>
  </symbol>

  <!-- UUID 指纹 -->
  <symbol id="icon-fingerprint" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M12 5c3 0 5 2.2 5 5 0 2-.8 3.2-2 4.5M12 19c-3 0-5-2.2-5-5 0-2 .8-3.2 2-4.5M8.5 9.5c0 2 1.5 3.5 3.5 3.5M15.5 14.5c0-2-1.5-3.5-3.5-3.5" stroke="url(#g-accent-v)" stroke-width="1.2" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <circle cx="12" cy="12" r="1.2" fill="#22d3ee"/>
  </symbol>

  <!-- 时钟 -->
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1"/>
    <circle cx="12" cy="12" r="7" fill="none" stroke="#0891b2" stroke-width="0.5" stroke-opacity="0.4"/>
    <path d="M12 7v5.5l3.5 2" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="12" cy="12" r="1" fill="#67e8f9"/>
  </symbol>

  <!-- 命名 T -->
  <symbol id="icon-type" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M8 8h8M12 8v9" stroke="url(#g-accent)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M8 17h8" stroke="#0891b2" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </symbol>

  <!-- 链接 -->
  <symbol id="icon-link" viewBox="0 0 24 24">
    <path d="M9.5 14.5 7.8 16.2a3.5 3.5 0 0 1-5-5l1.7-1.7a3.5 3.5 0 0 1 5 5" fill="none" stroke="url(#g-accent-v)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M14.5 9.5l1.7-1.7a3.5 3.5 0 0 1 5 5l-1.7 1.7a3.5 3.5 0 0 1-5-5" fill="none" stroke="url(#g-accent)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 14l4-4" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- 哈希 # -->
  <symbol id="icon-hash" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.8" stroke-opacity="0.45"/>
    <path d="M9 7l-1.5 10M15 7l-1.5 10M7 10h10M6.5 14h10" stroke="url(#g-accent)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  </symbol>

  <!-- 密钥 -->
  <symbol id="icon-key" viewBox="0 0 24 24">
    <circle cx="9" cy="11" r="4.5" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="9" cy="11" r="1.5" fill="#22d3ee"/>
    <path d="M12.5 13.5 19 20M16 17l2 2M14.5 15.5l2 2" stroke="url(#g-accent-v)" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 调色板 -->
  <symbol id="icon-palette" viewBox="0 0 24 24">
    <path d="M12 3C7.6 3 4 6.4 4 10.5 4 14 6.5 16 9 16h1.2c.8 0 1.3.8 1 1.5-.3.8.3 1.5 1.1 1.5H14c2.8 0 5-2.2 5-5.5C19 6.4 15.8 3 12 3Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <circle cx="8.5" cy="9.5" r="1.3" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="12" cy="7.5" r="1.3" fill="#0891b2"/>
    <circle cx="15" cy="10" r="1.3" fill="#67e8f9"/>
    <circle cx="13" cy="13.5" r="1.3" fill="#0e7490"/>
  </symbol>

  <!-- 文本对比 -->
  <symbol id="icon-git-compare" viewBox="0 0 24 24">
    <rect x="3" y="5" width="8" height="14" rx="2" fill="url(#g-panel)" stroke="#0891b2" stroke-width="0.9"/>
    <rect x="13" y="5" width="8" height="14" rx="2" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M7 9h2M7 12h3M7 15h2" stroke="#67e8f9" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M17 9h2M17 12h3M17 15h2" stroke="#22d3ee" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M11 12h2" stroke="url(#g-accent)" stroke-width="1.2" stroke-linecap="round" filter="url(#glow)"/>
  </symbol>

  <!-- 文本统计 -->
  <symbol id="icon-file-text" viewBox="0 0 24 24">
    <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M14 3v5h5" fill="none" stroke="url(#g-accent-v)" stroke-width="0.8"/>
    <path d="M8.5 12h7M8.5 15h5M8.5 18h6" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" filter="url(#glow)"/>
  </symbol>

  <!-- 去重 -->
  <symbol id="icon-list-minus" viewBox="0 0 24 24">
    <rect x="4" y="3" width="16" height="18" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M8 8h8M8 12h8M8 16h5" stroke="#0891b2" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <circle cx="17" cy="16" r="3" fill="#0f172a" stroke="#22d3ee" stroke-width="1" filter="url(#glow)"/>
    <path d="M15.5 16h3" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- JWT 盾牌 -->
  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path d="M12 2.5 4.5 5.5v6c0 4.5 3.2 8.7 7.5 9.8 4.3-1.1 7.5-5.3 7.5-9.8v-6L12 2.5Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1" stroke-linejoin="round"/>
    <path d="M9 12.5 11 14.5 15 10" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="12" cy="8" r="1.5" fill="#0891b2" opacity="0.8"/>
  </symbol>

  <!-- 锁 AES -->
  <symbol id="icon-lock" viewBox="0 0 24 24">
    <rect x="6" y="11" width="12" height="9" rx="2" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1"/>
    <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="url(#g-accent-v)" stroke-width="1.4" filter="url(#glow)"/>
    <circle cx="12" cy="15.5" r="1.5" fill="#22d3ee"/>
    <path d="M12 17v1.5" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- 正则 .* -->
  <symbol id="icon-regex" viewBox="0 0 24 24">
    <rect x="2" y="6" width="20" height="12" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <text x="5" y="14.5" font-family="monospace" font-size="7" font-weight="700" fill="#22d3ee" filter="url(#glow)">.*</text>
    <path d="M14 10.5c1.5 0 2.5 1 2.5 2.5s-1 2.5-2.5 2.5" stroke="#67e8f9" stroke-width="1.2" fill="none"/>
  </symbol>

  <!-- HTML 代码 -->
  <symbol id="icon-code" viewBox="0 0 24 24">
    <path d="M8 6 4 12l4 6M16 6l4 6-4 6" stroke="url(#g-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    <path d="M13 5l-2 14" stroke="#0891b2" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="url(#g-accent)" stroke-width="0.5" stroke-opacity="0.3"/>
  </symbol>

  <!-- 图片文件 -->
  <symbol id="icon-file-image" viewBox="0 0 24 24">
    <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <circle cx="9.5" cy="10" r="1.5" fill="#22d3ee" filter="url(#glow)"/>
    <path d="M6 18l4.5-4 3 2.5L16 13l3 5" stroke="#67e8f9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <!-- 二维码 -->
  <symbol id="icon-qrcode" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <rect x="5.5" y="5.5" width="5" height="5" rx="1" fill="none" stroke="#22d3ee" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="13.5" y="5.5" width="5" height="5" rx="1" fill="none" stroke="#0891b2" stroke-width="1"/>
    <rect x="5.5" y="13.5" width="5" height="5" rx="1" fill="none" stroke="#0891b2" stroke-width="1"/>
    <rect x="14" y="14" width="2" height="2" fill="#22d3ee"/>
    <rect x="17" y="14" width="2" height="2" fill="#67e8f9"/>
    <rect x="14" y="17" width="2" height="2" fill="#67e8f9"/>
  </symbol>

  <!-- 日历 Cron -->
  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M3 9h18" stroke="#0891b2" stroke-width="1"/>
    <path d="M8 3v4M16 3v4" stroke="url(#g-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="8" cy="14" r="1.2" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="12" cy="14" r="1.2" fill="#0891b2"/>
    <circle cx="16" cy="14" r="1.2" fill="#67e8f9"/>
    <circle cx="8" cy="17.5" r="1.2" fill="#0891b2" opacity="0.6"/>
  </symbol>

  <!-- 终端 cURL -->
  <symbol id="icon-terminal" viewBox="0 0 24 24">
    <rect x="2" y="4" width="20" height="16" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <rect x="2" y="4" width="20" height="4.5" rx="3" fill="url(#g-shine)"/>
    <circle cx="5" cy="6.2" r="0.7" fill="#22d3ee"/>
    <circle cx="7.2" cy="6.2" r="0.7" fill="#0891b2"/>
    <path d="M6 12.5 9 15l-3 2.5M11 17.5h5" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </symbol>

  <!-- gitignore 文件夹 -->
  <symbol id="icon-folder-git" viewBox="0 0 24 24">
    <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l1.5 2H19.5A1.5 1.5 0 0 1 21 9.5V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V7.5Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <circle cx="12" cy="14" r="3" fill="#0f172a" stroke="#22d3ee" stroke-width="0.9" filter="url(#glow)"/>
    <path d="M10.5 14.5 11.5 15.5 13.5 13" stroke="#22d3ee" stroke-width="0.9" stroke-linecap="round"/>
  </symbol>

  <!-- GitHub 徽章 -->
  <symbol id="icon-badge" viewBox="0 0 24 24">
    <rect x="2" y="8" width="20" height="8" rx="4" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <rect x="2" y="8" width="8" height="8" rx="4" fill="url(#g-accent)" opacity="0.85"/>
    <rect x="2" y="8" width="8" height="3" rx="4" fill="url(#g-shine)"/>
    <path d="M11.5 12h7" stroke="#67e8f9" stroke-width="1" stroke-linecap="round"/>
    <circle cx="6" cy="12" r="1.2" fill="#ecfeff"/>
  </symbol>

  <!-- Markdown -->
  <symbol id="icon-file-code" viewBox="0 0 24 24">
    <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M8.5 13 7 14.5l1.5 1.5M12.5 13l1.5 1.5-1.5 1.5" stroke="#22d3ee" stroke-width="1.1" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M15.5 16h2" stroke="#0891b2" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- IP 网络 -->
  <symbol id="icon-network" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="2.2" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="5" cy="7" r="2" fill="url(#g-panel)" stroke="#0891b2" stroke-width="0.9"/>
    <circle cx="19" cy="7" r="2" fill="url(#g-panel)" stroke="#0891b2" stroke-width="0.9"/>
    <circle cx="5" cy="17" r="2" fill="url(#g-panel)" stroke="#0891b2" stroke-width="0.9"/>
    <circle cx="19" cy="17" r="2" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M7 8l3.5 3M17 8l-3.5 3M7 16l3.5-3M17 16l-3.5-3" stroke="#67e8f9" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
  </symbol>

  <!-- 图片缩放 -->
  <symbol id="icon-image" viewBox="0 0 24 24">
    <rect x="3" y="5" width="14" height="14" rx="2" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <circle cx="7.5" cy="9.5" r="1.2" fill="#22d3ee"/>
    <path d="M4 16l3.5-3 2.5 2 3-3.5L16 14" stroke="#67e8f9" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M16 8h5v5M16 13l5-5" stroke="url(#g-accent)" stroke-width="1.2" stroke-linecap="round" filter="url(#glow)"/>
  </symbol>

  <!-- 图片压缩 -->
  <symbol id="icon-compress" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="3" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M9 9l-3-3M9 15l-3 3M15 9l3-3M15 15l3 3" stroke="#22d3ee" stroke-width="1.3" stroke-linecap="round" filter="url(#glow)"/>
    <rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="#0891b2" stroke-width="1"/>
  </symbol>

  <!-- 格式转换 -->
  <symbol id="icon-convert" viewBox="0 0 24 24">
    <rect x="3" y="6" width="8" height="12" rx="2" fill="url(#g-panel)" stroke="#0891b2" stroke-width="0.9"/>
    <rect x="13" y="6" width="8" height="12" rx="2" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <path d="M11 12h2M13 10.5v3" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M5.5 10h3M5.5 14h2" stroke="#67e8f9" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M15.5 10h3M15.5 14h2" stroke="#22d3ee" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </symbol>

  <!-- Favicon 生成 -->
  <symbol id="icon-favicon-gen" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="4" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="0.9"/>
    <rect x="6" y="6" width="12" height="12" rx="2" fill="#0f172a" stroke="#22d3ee" stroke-width="0.8" filter="url(#glow)"/>
    <rect x="8" y="9" width="3" height="3" rx="0.5" fill="#22d3ee"/>
    <rect x="12" y="9" width="3" height="3" rx="0.5" fill="#0891b2"/>
    <rect x="8" y="13" width="7" height="2" rx="0.5" fill="#0e7490"/>
  </symbol>

  <!-- 首页：工具箱 -->
  <symbol id="toolbox-icon" viewBox="0 0 24 24">
    <path d="M4 8.5 12 4l8 4.5v8L12 21l-8-4.5v-8Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="12" cy="12.5" r="2" fill="#22d3ee" filter="url(#glow)"/>
    <path d="M11 12.5h2M12 11.5v2" stroke="#0f172a" stroke-width="0.85" stroke-linecap="round"/>
  </symbol>

  <!-- 首页：本地隐私 -->
  <symbol id="shield-local-icon" viewBox="0 0 24 24">
    <path d="M12 3 4.5 6.5v5.8c0 4.2 3.2 8.1 7.5 9.2 4.3-1.1 7.5-5 7.5-9.2V6.5L12 3Z" fill="url(#g-panel)" stroke="url(#g-accent)" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="8.5" y="9.5" width="7" height="5.5" rx="1" fill="#0f172a" stroke="#22d3ee" stroke-width="0.85"/>
    <path d="M10 12h4M12 10.5v3" stroke="#22d3ee" stroke-width="0.75" stroke-linecap="round" filter="url(#glow)"/>
  </symbol>

  <!-- 首页：sparkle -->
  <symbol id="sparkle-icon" viewBox="0 0 24 24">
    <path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5L12 2Z" fill="url(#g-accent)" filter="url(#glow)"/>
    <path d="M19 14l.8 2.8L22.5 17.5l-2.7.7L19 21l-.8-2.8-2.7-.7 2.7-.7L19 14Z" fill="#0891b2" opacity="0.85"/>
  </symbol>
</svg>
